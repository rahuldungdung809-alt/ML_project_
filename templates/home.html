<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: #1f2937;
        }

        .login {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .mb-3 {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .submit-btn {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e40af;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .login {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Student Exam Performance Indicator</h1>
        <p class="subtitle">
            Enter the student's details to predict exam performance.
        </p>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="form-grid">

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label" for="gender">Gender</label>
                    <select class="form-control" id="gender" name="gender" required>
                        <option value="" selected disabled>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Ethnicity -->
                <div class="mb-3">
                    <label class="form-label" for="ethnicity">
                        Race or Ethnicity
                    </label>
                    <select class="form-control" id="ethnicity"
                            name="ethnicity" required>
                        <option value="" selected disabled>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <!-- Parental Education -->
                <div class="mb-3">
                    <label class="form-label" for="parental_level_of_education">
                        Parental Level of Education
                    </label>
                    <select class="form-control"
                            id="parental_level_of_education"
                            name="parental_level_of_education" required>
                        <option value="" selected disabled>
                            Select Parent Education
                        </option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <!-- Lunch -->
                <div class="mb-3">
                    <label class="form-label" for="lunch">Lunch Type</label>
                    <select class="form-control" id="lunch" name="lunch" required>
                        <option value="" selected disabled>Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <!-- Test Preparation -->
                <div class="mb-3">
                    <label class="form-label" for="test_preparation_course">
                        Test Preparation Course
                    </label>
                    <select class="form-control"
                            id="test_preparation_course"
                            name="test_preparation_course" required>
                        <option value="" selected disabled>
                            Select Preparation Status
                        </option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <!-- Reading Score -->
                <div class="mb-3">
                    <label class="form-label" for="reading_score">
                        Reading Score (0–100)
                    </label>
                    <input class="form-control" type="number"
                           id="reading_score" name="reading_score"
                           min="0" max="100" step="1"
                           placeholder="Enter reading score" required>
                </div>

                <!-- Writing Score -->
                <div class="mb-3">
                    <label class="form-label" for="writing_score">
                        Writing Score (0–100)
                    </label>
                    <input class="form-control" type="number"
                           id="writing_score" name="writing_score"
                           min="0" max="100" step="1"
                           placeholder="Enter writing score" required>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                Predict Math Score
            </button>

        </form>

        {% if results is defined and results is not none %}
            <div class="result">
                Predicted Math Score: {{results}}
            </div>
        {% endif %}

    </div>

</body>
</html>
